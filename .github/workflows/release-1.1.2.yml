name: Publish FPProxy Checker 1.1.2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-1.1.2.yml'
      - 'releases/1.1.2.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fp-proxy-checker-release-1.1.2
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out release source
        uses: actions/checkout@v4

      - name: Ensure correct application version
        run: |
          grep -q 'versionCode = 1102' app/build.gradle.kts
          grep -q 'versionName = "1.1.2"' app/build.gradle.kts

      - name: Install Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test and build installable APK
        run: bash gradlew :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Verify APK and prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/debug/app-debug.apk FPProxyChecker-v1.1.2.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose FPProxyChecker-v1.1.2.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging FPProxyChecker-v1.1.2.apk | grep "versionName='1.1.2'"
          sha256sum FPProxyChecker-v1.1.2.apk > FPProxyChecker-v1.1.2.apk.sha256

      - name: Replace APK assets in existing GitHub Release 1.1.2
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          # Only replace the existing 1.1.2 release; never create a new release.
          gh release view 1.1.2 >/dev/null
          gh release upload 1.1.2 \
            FPProxyChecker-v1.1.2.apk \
            FPProxyChecker-v1.1.2.apk.sha256 \
            --clobber
          gh release edit 1.1.2 \
            --notes-file releases/1.1.2.md \
            --latest
          # Keep the original release tag aligned with the replaced APK's source.
          gh api --method PATCH \
            "repos/${GITHUB_REPOSITORY}/git/refs/tags/1.1.2" \
            -f sha="$GITHUB_SHA" -F force=true >/dev/null
