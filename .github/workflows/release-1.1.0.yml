name: Publish FPProxy Checker 1.1.0

on:
  push:
    branches: [main]
    paths:
      - 'app/build.gradle.kts'
      - '.github/workflows/release-1.1.0.yml'
      - 'releases/1.1.0.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fp-proxy-checker-release-1.1.0
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out release source
        uses: actions/checkout@v4

      - name: Ensure correct application version
        run: |
          grep -q 'versionCode = 1100' app/build.gradle.kts
          grep -q 'versionName = "1.1.0"' app/build.gradle.kts

      - name: Install Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test and build installable APK
        run: bash gradlew :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Verify APK and prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/debug/app-debug.apk FPProxyChecker-v1.1.0.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose FPProxyChecker-v1.1.0.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging FPProxyChecker-v1.1.0.apk | grep "versionName='1.1.0'"
          sha256sum FPProxyChecker-v1.1.0.apk > FPProxyChecker-v1.1.0.apk.sha256

      - name: Publish GitHub Release and APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view 1.1.0 >/dev/null 2>&1; then
            echo "Release 1.1.0 already exists; preserving existing signed APK."
            exit 0
          fi
          gh release create 1.1.0 \
            FPProxyChecker-v1.1.0.apk \
            FPProxyChecker-v1.1.0.apk.sha256 \
            --target "$GITHUB_SHA" \
            --title "FPProxy Checker 1.1.0" \
            --notes-file releases/1.1.0.md \
            --latest
